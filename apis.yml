name: Heron Power
description: >-
  Heron Power is an industrial power-electronics company modernizing the
  electrical grid with solid-state transformers and integrated power
  conversion systems. Founded by former Tesla executive Drew Baglino, the
  company builds Heron Link products that combine a solid-state transformer
  with a power supply or inverter for two markets: data centers (AI and
  hyperscale power delivery, including 800 VDC datacenter architectures) and
  solar-and-storage renewable energy systems. Heron Power targets the grid
  infrastructure bottlenecks of the clean-energy transition, replacing century-old
  passive transformer technology with dense, controllable, software-defined
  power hardware. The company is backed by Andreessen Horowitz (a16z) and
  Breakthrough Energy. Heron Power is a hardware and infrastructure company and
  does not currently publish a public API, developer portal, or SDKs; this
  profile is maintained in the API Evangelist network for company intelligence.
